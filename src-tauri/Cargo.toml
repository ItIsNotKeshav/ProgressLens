[package]
name = "progress-lens"
version = "0.1.0"
description = "ProgressLens — Student Performance Tracker"
authors = ["ProgressLens Team"]
edition = "2021"

[lib]
name = "progress_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
sqlx                = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tokio               = { version = "1", features = ["full"] }
thiserror           = "1"
chrono              = { version = "0.4", features = ["serde"] }
log                 = "0.4"
reqwest             = { version = "0.12", features = ["json"] }
oauth2              = "5"
url                 = "2"
regex               = "1"
open                = "5"

[profile.dev]
incremental = true

[profile.release]
panic         = "abort"
codegen-units = 1
