version: "3.9"

# ──────────────────────────────────────────────────────────────
# docker-compose.yml — ProgressLens dev environment
#
# Usage:
#   docker compose up
#
# This runs the Vite dev server inside a container so the
# frontend hot-reloads during development.
# The Tauri native shell must still run on your host machine:
#   cargo tauri dev
#
# The frontend dev server is exposed on host:1420 so Tauri
# can connect to it as normal.
# ──────────────────────────────────────────────────────────────

services:
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules   # anonymous volume avoids host ↔ container mismatch
    ports:
      - "1420:1420"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 1420"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1420"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
